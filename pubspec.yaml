name: anichan
description: "AniChan - a minimalist anime streaming client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State / DI
  provider: ^6.1.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Networking / scraping
  dio: ^5.4.3
  html: ^0.15.4
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # Video playback
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  # OAuth (AniList / MAL)
  flutter_web_auth_2: ^4.1.0

  # Discord RPC
  web_socket_channel: ^2.4.5
  flutter_foreground_task: ^6.1.2
  permission_handler: ^11.3.1

  # UI
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/anichan_icon.svg
